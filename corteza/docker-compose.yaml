# Official offline deployment (server + Postgres 15).
# Docs: https://docs.cortezaproject.org/corteza-docs/2024.9/devops-guide/index.html

services:
  server:
    image: cortezaproject/corteza:${VERSION}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - serverdata:/data
      - ../spa/dist:/corteza/webapp/tickets:ro

  db:
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corteza"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: corteza
      POSTGRES_DB: corteza

volumes:
  dbdata:
  serverdata:
